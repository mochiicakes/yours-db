name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned so CI cannot change under us. Bump it on purpose, together with the supabase devDependency.
          version: 2.119.0
      # Only Postgres is needed to run the pgTAP suite.
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,inbucket,realtime,storage-api,gotrue,kong,postgrest,postgres-meta,mailpit
      - run: supabase test db
